name: 新实验提议 / Experiment request
description: 提议一个希望加入 HoloGrip 的新实验
labels: [experiment, enhancement]
body:
  - type: dropdown
    id: discipline
    attributes:
      label: 学科
      options: [力学, 光学, 电磁学, 热学, 数学, 化学, 其他]
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: 实验名称
      placeholder: 例如：迈克尔逊干涉仪
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 教学目标与关键现象
      description: 学生应当观察到什么？涉及哪些可调参数？
    validations:
      required: true
  - type: textarea
    id: apparatus
    attributes:
      label: 器材与参考资料
      description: 真实器材照片、教材章节或公式参考
