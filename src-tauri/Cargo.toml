[package]
name = "virtuallab"
version = "0.1.0"
description = "3D Virtual Laboratory - Tauri 2 Core"
authors = ["VirtualLab Team"]
license = "AGPL-3.0-only"
repository = "https://github.com/SenorPink0487/HoloGrip-Beta"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "virtuallab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
tauri-utils = { version = "2", features = ["build-2"] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
rayon = "1.10"

[features]
custom-protocol = ["tauri/custom-protocol"]

[patch.crates-io]
swift-rs = { git = "https://github.com/michakfromparis/swift-rs", rev = "3788d3d2bae8e7a863b3e281a59477438e12c632" }
tao = { git = "https://github.com/tauri-apps/tao", rev = "f2163508" }
