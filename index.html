<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>3D Virtual Laboratory · Tauri 2.0</title>
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-border-specular: rgba(255, 255, 255, 0.25);
      --apple-blue: #0a84ff;
      --apple-green: #34c759;
      --apple-orange: #ff9f0a;
      --apple-red: #ff453a;
      --apple-purple: #bf5af2;
      --apple-teal: #64d2ff;
      --apple-indigo: #5e5ce6;
      --apple-pink: #ff375f;
      --bg-dark: rgba(26, 26, 30, 0.72);
      --text-main: #f5f5f7;
      --text-dim: #86868b;
      --cyan-glow: #0a84ff;
      --border-cyber: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #020409;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "PingFang SC", "Segoe UI", Roboto, sans-serif;
    }

    #webgl-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      outline: none;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    /* Common Apple Frosted Glass Styling */
    .hud-interactive {
      pointer-events: auto;
    }

    .hud-panel {
      background: var(--bg-dark);
      border: 1px solid var(--glass-border);
      border-top: 1px solid var(--glass-border-specular);
      border-radius: 18px;
      backdrop-filter: blur(32px) saturate(190%);
      -webkit-backdrop-filter: blur(32px) saturate(190%);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
    }

    /* Top Navigation Bar (Hidden per user request: delete top row) */
    #hud-topbar {
      display: none !important;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      min-height: 52px;
      height: calc(52px + env(safe-area-inset-top, 0px));
      padding-top: env(safe-area-inset-top, 0px);
      padding-left: calc(20px + env(safe-area-inset-left, 0px));
      padding-right: calc(20px + env(safe-area-inset-right, 0px));
      padding-bottom: 0;
      z-index: 1000;
    }

    .topbar-left, .topbar-center, .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .logo-glyph {
      color: #ffffff;
      font-size: 16px;
      opacity: 0.95;
    }

    .logo-title {
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: -0.2px;
      color: #ffffff;
    }

    .topbar-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 980px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .topbar-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .current-exp-title {
      font-size: 13.5px;
      font-weight: 600;
      color: #f5f5f7;
      letter-spacing: -0.1px;
    }

    .topbar-icon-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f5f5f7;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .topbar-icon-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.24);
      transform: scale(1.05);
    }

    /* Experiment Drawer - Apple Sidebar Style */
    #experiment-drawer {
      position: fixed;
      top: 0;
      left: 0;
      width: 380px;
      max-width: 90vw;
      height: 100%;
      background: rgba(24, 24, 28, 0.88);
      border-right: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(40px) saturate(190%);
      -webkit-backdrop-filter: blur(40px) saturate(190%);
      box-shadow: 16px 0 40px rgba(0, 0, 0, 0.5);
      transform: translateX(-100%);
      transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1200;
      display: flex;
      flex-direction: column;
    }

    #experiment-drawer.open {
      transform: translateX(0);
    }

    .drawer-header {
      padding: 20px;
      padding-top: calc(env(safe-area-inset-top, 0px) + 20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .drawer-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .drawer-title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.2px;
      color: #ffffff;
    }

    .drawer-close-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #86868b;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .drawer-close-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      color: #ffffff;
    }

    .search-input-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 10px;
      color: rgba(255, 255, 255, 0.4);
      pointer-events: none;
    }

    .drawer-search-row input {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      padding: 8px 12px 8px 30px;
      border-radius: 10px;
      font-size: 12px;
      outline: none;
      transition: all 0.2s ease;
    }

    .drawer-search-row input:focus {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--apple-blue);
      box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.25);
    }

    .drawer-category-tabs {
      display: flex;
      gap: 4px;
      background: rgba(255, 255, 255, 0.06);
      padding: 3px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .drawer-category-tabs::-webkit-scrollbar {
      display: none;
    }

    .category-chip {
      white-space: nowrap;
      background: transparent;
      border: none;
      color: #86868b;
      font-size: 11px;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .category-chip:hover {
      color: #ffffff;
    }

    .category-chip.active {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    .drawer-list {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .experiment-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .experiment-card:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.18);
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3);
    }

    .experiment-card.active {
      background: rgba(10, 132, 255, 0.12);
      border-color: rgba(10, 132, 255, 0.5);
      box-shadow: 0 0 0 1px rgba(10, 132, 255, 0.3), 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    .card-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-icon-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-icon {
      font-size: 16px;
    }

    .card-title {
      font-size: 13.5px;
      font-weight: 600;
      color: #f5f5f7;
    }

    .card-intensity {
      font-size: 9.5px;
      font-weight: 500;
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid;
    }

    .card-desc {
      font-size: 11.5px;
      color: #86868b;
      line-height: 1.5;
    }

    .card-equation {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Times New Roman", serif;
      font-style: italic;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.7);
      background: rgba(255, 255, 255, 0.05);
      padding: 4px 8px;
      border-radius: 6px;
    }

    .card-tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .card-tag {
      font-size: 9.5px;
      color: #86868b;
      background: rgba(255, 255, 255, 0.04);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .drawer-footer {
      padding: 12px 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 11px;
      color: #86868b;
      text-align: center;
    }

    /* Parameter Panel (Top Right Inspector) */
    #param-panel {
      position: fixed;
      top: calc(16px + env(safe-area-inset-top, 0px));
      right: calc(18px + env(safe-area-inset-right, 0px));
      width: 290px;
      max-height: calc(100vh - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
      z-index: 1000;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 18px;
      background: rgba(26, 26, 30, 0.72);
      backdrop-filter: blur(35px) saturate(190%);
      -webkit-backdrop-filter: blur(35px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-top: 1px solid rgba(255, 255, 255, 0.28);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.38);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #param-panel.collapsed {
      max-height: 44px;
    }

    .panel-header {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .panel-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
    }

    .panel-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.1px;
      color: #f5f5f7;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    .panel-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .panel-icon-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #86868b;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .panel-icon-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.24);
      transform: scale(1.06);
    }

    .panel-collapse-btn {
      background: transparent;
      border: none;
      color: #86868b;
      width: 22px;
      height: 22px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .panel-collapse-btn:hover {
      color: #ffffff;
    }

    .panel-collapse-btn .sf-chevron {
      transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .panel-equation {
      padding: 8px 16px;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Times New Roman", serif;
      font-style: italic;
      font-size: 11.5px;
      color: rgba(255, 255, 255, 0.55);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      text-align: center;
    }

    .panel-content {
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .panel-empty {
      font-size: 11px;
      color: #86868b;
      text-align: center;
      padding: 12px 0;
    }

    .param-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .param-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .param-name {
      font-size: 12px;
      color: #86868b;
    }

    .param-val {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", monospace;
      font-size: 12px;
      font-weight: 600;
      color: #f5f5f7;
    }

    /* Apple iOS-Style Slider */
    .param-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.16);
      outline: none;
      transition: background 0.2s;
    }

    .param-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
      border: 0.5px solid rgba(0, 0, 0, 0.04);
      transition: transform 0.15s ease;
    }

    .param-slider::-webkit-slider-thumb:hover {
      transform: scale(1.08);
    }

    /* Apple iOS-Style Switch */
    .switch-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cyber-switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 22px;
    }

    .cyber-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider.round {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255, 255, 255, 0.18);
      transition: .25s ease;
      border-radius: 22px;
    }

    .slider.round:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 2px;
      bottom: 2px;
      background-color: #ffffff;
      transition: .25s cubic-bezier(0.16, 1, 0.3, 1);
      border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
    }

    input:checked + .slider {
      background-color: #34c759;
    }

    input:checked + .slider:before {
      transform: translateX(16px);
      background-color: #ffffff;
    }

    /* Performance Overlay (Apple Metal HUD Style - Top Left Corner) */
    #perf-overlay {
      position: fixed;
      top: calc(16px + env(safe-area-inset-top, 0px));
      left: calc(18px + env(safe-area-inset-left, 0px));
      bottom: auto;
      z-index: 1000;
      pointer-events: auto;
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.22s ease, transform 0.22s ease;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    #perf-overlay.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-6px);
    }

    .perf-dock-bottom-fallback {
      bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    }

    body.has-touch-controls #perf-overlay {
      top: calc(16px + env(safe-area-inset-top, 0px));
      bottom: calc(165px + env(safe-area-inset-bottom, 0px));
    }

    @media (pointer: coarse), (max-width: 768px) {
      #perf-overlay {
        top: calc(14px + env(safe-area-inset-top, 0px));
        left: calc(14px + env(safe-area-inset-left, 0px));
        bottom: calc(165px + env(safe-area-inset-bottom, 0px));
      }
    }

    .perf-pill-capsule {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 6px 14px;
      border-radius: 980px;
      background: rgba(22, 22, 26, 0.72);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-top: 1px solid rgba(255, 255, 255, 0.24);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.32);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .perf-pill-capsule:hover {
      background: rgba(28, 28, 34, 0.85);
      border-color: rgba(255, 255, 255, 0.25);
      transform: scale(1.02);
    }

    .perf-status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--apple-green);
      box-shadow: 0 0 8px var(--apple-green);
      transition: background 0.3s, box-shadow 0.3s;
    }

    .perf-pill-item {
      display: flex;
      align-items: baseline;
      gap: 4px;
    }

    .perf-pill-label {
      color: rgba(255, 255, 255, 0.5);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: -0.1px;
    }

    .perf-pill-val {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", monospace;
      font-size: 12.5px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: #f5f5f7;
    }

    .perf-pill-unit {
      color: rgba(255, 255, 255, 0.4);
      font-size: 10px;
      font-weight: 500;
    }

    .perf-pill-divider {
      width: 1px;
      height: 12px;
      background: rgba(255, 255, 255, 0.15);
    }

    .perf-details-popover {
      display: none;
      margin-top: 8px;
      padding: 10px 14px;
      border-radius: 14px;
      background: rgba(22, 22, 26, 0.85);
      backdrop-filter: blur(32px) saturate(190%);
      -webkit-backdrop-filter: blur(32px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
      flex-direction: column;
      gap: 6px;
      font-size: 11px;
    }

    .perf-details-popover.open {
      display: flex;
    }

    .perf-detail-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
    }

    .perf-detail-label {
      color: #86868b;
      font-size: 10.5px;
      font-weight: 500;
    }

    .perf-detail-val {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", monospace;
      font-size: 11px;
      font-weight: 600;
      color: #f5f5f7;
    }

    .perf-fps {
      color: var(--apple-green);
    }

    .perf-compute {
      color: var(--apple-blue);
    }

    /* Transition Toast */
    #transition-toast {
      position: fixed;
      top: calc(20px + env(safe-area-inset-top, 0px));
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(28, 28, 32, 0.88);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.38);
      border-radius: 980px;
      padding: 8px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 2000;
      font-size: 12px;
      font-weight: 500;
      color: #fff;
    }

    #transition-toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast-spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ========================================================== */
    /* VisionOS Crosshair Styling - Apple Reticle */
    /* ========================================================== */
    #vision-crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 1500;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.25s ease;
    }

    #vision-crosshair.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .crosshair-ring {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      box-sizing: border-box;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .crosshair-dot {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 3px;
      height: 3px;
      margin-top: -1.5px;
      margin-left: -1.5px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
      transition: all 0.2s ease;
    }

    .crosshair-tooltip {
      position: absolute;
      top: 34px;
      white-space: nowrap;
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: -0.1px;
      color: #ffffff;
      background: rgba(24, 24, 28, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-top: 1px solid rgba(255, 255, 255, 0.26);
      border-radius: 980px;
      padding: 5px 13px;
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      opacity: 0;
      transform: translateY(-4px);
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .crosshair-tooltip.visible {
      opacity: 1;
      transform: translateY(0);
    }

    #vision-crosshair.hovered .crosshair-ring {
      width: 38px;
      height: 38px;
      border-color: rgba(255, 255, 255, 0.85);
      box-shadow: 0 0 16px rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.08);
    }

    #vision-crosshair.hovered .crosshair-dot {
      background: #ffffff;
      transform: scale(1.2);
    }

    /* ========================================================== */
    /* VisionOS 3D Spatial Window (Apple Vision Pro Glass) */
    /* ========================================================== */
    #css3d-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 50;
    }

    .vision-spatial-window {
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: auto;
      user-select: none;
      transition: transform 0.38s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.32s cubic-bezier(0.16, 1, 0.3, 1);
      transform: scale(1);
      opacity: 1;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .vision-spatial-window.hidden {
      transform: scale(0.92);
      opacity: 0;
      pointer-events: none !important;
      visibility: hidden;
    }

    .vision-window-frame {
      position: relative;
      width: 1260px;
      height: 710px;
      background: rgba(24, 24, 28, 0.68);
      backdrop-filter: blur(40px) saturate(190%);
      -webkit-backdrop-filter: blur(40px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-top: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 28px;
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.06) inset;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .vision-window-mover-bar {
      width: 120px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.3);
      margin-top: 10px;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    .vision-window-mover-bar:hover {
      background: rgba(255, 255, 255, 0.65);
      transform: scaleY(1.4);
    }

    /* Vision Window Header - Apple Translucent Capsule Nav */
    .vision-window-header {
      height: 52px;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.04);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      user-select: none;
    }

    .header-left, .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .vision-window-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: -0.1px;
      color: rgba(255, 255, 255, 0.95);
    }

    .vision-glyph {
      font-size: 15px;
      color: #ffffff;
    }

    .vision-nav-pills {
      display: flex;
      gap: 3px;
      background: rgba(255, 255, 255, 0.06);
      padding: 3px;
      border-radius: 980px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .nav-pill {
      background: transparent;
      border: none;
      color: #86868b;
      font-size: 12px;
      font-weight: 500;
      padding: 5px 14px;
      border-radius: 980px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .nav-pill:hover {
      color: #ffffff;
    }

    .nav-pill.active {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    .vision-drag-indicator {
      width: 32px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.2);
    }

    .vision-window-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.85);
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .vision-window-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
      transform: scale(1.05);
    }

    .vision-window-btn.btn-close:hover {
      background: rgba(255, 69, 58, 0.3);
      border-color: rgba(255, 69, 58, 0.5);
      color: #ffffff;
    }

    /* Window Body */
    .vision-window-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 22px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    /* ========================================================== */
    /* Discipline Selector Styling */
    /* ========================================================== */
    .vision-discipline-container {
      display: flex;
      flex-direction: column;
      gap: 24px;
      height: 100%;
      justify-content: center;
      padding: 20px 40px;
    }

    .discipline-hero-header {
      text-align: center;
    }

    .hero-title {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.4px;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .hero-subtitle {
      font-size: 13px;
      color: #86868b;
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.5;
    }

    .discipline-cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      max-width: 1140px;
      margin: 0 auto;
      width: 100%;
    }

    .discipline-card {
      position: relative;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      padding: 24px;
      cursor: pointer;
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);

      border-color: rgba(255, 255, 255, 0.22);

    .card-glass-content {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .card-icon-banner {
      margin-bottom: 12px;
    }

    .vision-card-svg {
      width: 30px;
      height: 30px;
      color: rgba(255, 255, 255, 0.9);
      display: block;
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: -0.2px;
    }

    .card-desc {
      font-size: 12px;
      color: #86868b;
      line-height: 1.6;
      margin-bottom: 14px;

    .card-meta-line {

    .phys-quick-btn {

      border: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.85);

      font-weight: 500;
      padding: 6px 8px;

    .phys-quick-btn:hover {
      background: rgba(255, 255, 255, 0.15);

      border-color: rgba(255, 255, 255, 0.25);
    }

    .vision-card-action-btn {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #ffffff;
      padding: 10px 16px;

      align-items: center;

    }

    .vision-card-action-btn:hover {

    }

    .vision-card-action-btn.disabled-btn {

      cursor: default;

    /* Sector Entrance Pages (Physics & Math) */
    .vision-sector-page {
      display: flex;
      flex-direction: column;
      gap: 16px;
      height: 100%;
      min-height: 0;

    .sector-hero-badge {

      padding: 4px 14px;
      border-radius: 980px;
      display: inline-flex;
      align-items: center;
      gap: 6px;

    .sector-hero-title {
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.3px;
    }

    .sector-hero-desc {
      font-size: 13.5px;
      color: #a1a1a6;
      line-height: 1.6;
      max-width: 620px;
    }

    .sector-status-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;

    }

    .sector-status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #0a84ff;
      box-shadow: 0 0 10px #0a84ff;
      flex-shrink: 0;

    .sector-status-dot.math-dot {

    @keyframes pulse-dot {

      50% { opacity: 1; transform: scale(1.15); }
    }

    .sector-status-text {
      display: flex;

      gap: 2px;
      font-size: 12px;

    .sector-status-text strong {

    .sector-features-grid {

    .sector-feature-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 6px;
    }

    .feature-icon {
      font-size: 22px;
    }

    .feature-title {
      font-size: 12.5px;
      font-weight: 600;
      color: #ffffff;
    }

    .feature-desc {
      font-size: 11px;
      color: #86868b;
      line-height: 1.4;
    }

    /* ========================================================== */
    /* Periodic Table Matrix Styling (Apple Educational Style) */
    /* ========================================================== */
    .vision-periodic-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: 100%;
    }

    .periodic-top-controls {
      display: flex;
      justify-content: space-between;

    }

      font-weight: 500;

    .periodic-title-pill {

      gap: 6px;

      border: 1px solid rgba(255, 255, 255, 0.08);

      border: 1px solid rgba(255, 255, 255, 0.08);

      padding: 4px 10px;

      border-color: rgba(255, 255, 255, 0.28);
      color: #ffffff;

    .periodic-layout-split {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 14px;
      flex: 1;
      min-height: 0;
    }

    .periodic-grid-wrapper {
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-x: auto;
      overflow-y: auto;
      padding-right: 4px;
    }

    .periodic-grid {
      display: grid;
      grid-template-columns: repeat(18, minmax(32px, 1fr));
      grid-template-rows: repeat(7, 36px);
      gap: 3px;

      grid-template-columns: repeat(15, minmax(32px, 1fr));
      grid-template-rows: repeat(2, 32px);

    .element-cell {

      background: rgba(255, 255, 255, 0.05);

      gap: 5px;

    .metric-badge-tag.acid-strong { background: rgba(255, 69, 58, 0.25); color: #ff453a; }
    .metric-badge-tag.acid-weak { background: rgba(255, 159, 10, 0.2); color: #ff9f0a; }
    .metric-badge-tag.neutral { background: rgba(52, 199, 89, 0.2); color: #34c759; }

    .metric-badge-tag.base-strong { background: rgba(191, 90, 242, 0.25); color: #bf5af2; }

    .metric-progress-bar {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 2px;

    .ph-gradient-bar {

    /* Floating Launcher Button - Apple Vision Pro Capsule */
    #vision-floating-launcher {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1800;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #vision-floating-launcher.hidden {
      opacity: 0;
      transform: translateX(-50%) translateY(20px);
      pointer-events: none;
    }

    .launcher-inner {
      background: rgba(24, 24, 28, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-top: 1px solid rgba(255, 255, 255, 0.28);
      backdrop-filter: blur(28px) saturate(190%);

      border-radius: 980px;

      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      transition: all 0.2s ease;
    }

    .launcher-kbd {
