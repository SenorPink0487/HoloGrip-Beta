services:
  mysql:
    image: mysql:8.4
    container_name: virtuallab-account-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env.production}
      MYSQL_DATABASE: virtuallab
      MYSQL_USER: virtuallab
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env.production}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
      - --innodb-buffer-pool-size=128M
      - --max-connections=32
      - --performance-schema=OFF
    volumes:
      - account-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: 384m

  api:
    image: virtuallab-account-api:1.0.0
    container_name: virtuallab-account-api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env.production}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.production}
      BIND: 0.0.0.0:8080
      CORS_ORIGINS: https://hologrip.cn
      LOG_FORMAT: json
      RUST_LOG: info
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - 127.0.0.1:8080:8080
    mem_limit: 384m

volumes:
  account-mysql:
